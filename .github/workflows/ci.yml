name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - desenvolvimento

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxe
        run: python -m py_compile app.py

      - name: Executar testes
        run: python -m unittest discover